
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Lavastida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      background-color: #E8E3DD;
      color: #513933;
    }
    img {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 80%;
      height: auto;
    }
    h2 {
      text-align: center;
      color: #8F1C13;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #513933;
      border-radius: 5px;
      font-size: 16px;
      background-color: #fff;
      color: #513933;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #8F1C13;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 20px;
      font-size: 16px;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: #8F1C13;
    }
  </style>
</head>
<body>
  <img src="lavastida_logo.jpeg" alt="Logo Lavastida">
  <h2>Calculadora de Masa Madre</h2>

  <label for="total">Cantidad total deseada (g):</label>
  <input type="number" id="total" placeholder="Ej. 7000" />

  <label for="starterRatio">Starter Ratio:</label>
  <input type="number" id="starterRatio" value="1" step="any" />

  <label for="flourRatio">Harina Ratio:</label>
  <input type="number" id="flourRatio" value="3" step="any" />

  <label for="waterRatio">Agua Ratio:</label>
  <input type="number" id="waterRatio" value="2.5" step="any" />

  <button onclick="calcular()">Calcular</button>

  <div id="resultado">Los resultados aparecerán aquí.</div>

  <footer>
    Micropanadería Artesanal Lavastida
  </footer>

  <script>
    function calcular() {
      const total = parseFloat(document.getElementById("total").value);
      const s = parseFloat(document.getElementById("starterRatio").value);
      const f = parseFloat(document.getElementById("flourRatio").value);
      const w = parseFloat(document.getElementById("waterRatio").value);
      const resultado = document.getElementById("resultado");

      if (isNaN(total) || isNaN(s) || isNaN(f) || isNaN(w) || total <= 0 || s < 0 || f < 0 || w < 0) {
        resultado.innerHTML = "Por favor, introduce valores válidos.";
        return;
      }

      const partes = s + f + w;
      const base = total / partes;

      const starter = Math.round(base * s);
      const flour = Math.round(base * f);
      const water = Math.round(base * w);

      resultado.innerHTML = 
        "Starter: " + starter + " g<br>" +
        "Harina: " + flour + " g<br>" +
        "Agua: " + water + " g";
    }
  </script>
</body>
</html>
